<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000">
  <defs>
    <linearGradient id="social-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180b2a"/>
      <stop offset="60%" stop-color="#2d124d"/>
      <stop offset="100%" stop-color="#0a0314"/>
    </linearGradient>
    <linearGradient id="insta-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="1000" fill="url(#social-bg)"/>
  <!-- Social Card Feed Frame -->
  <rect x="79" y="238" width="442" height="562" rx="18" fill="#1f1137" stroke="url(#insta-grad)" stroke-width="2"/>
  <!-- Profile Avatar with Story Ring -->
  <circle cx="137" cy="306" r="28" fill="none" stroke="url(#insta-grad)" stroke-width="3"/>
  <circle cx="137" cy="306" r="22" fill="#ec4899"/>
  <rect x="180" y="288" width="172" height="15" rx="4" fill="#ffffff" fill-opacity=".9"/>
  <rect x="180" y="316" width="105" height="11" rx="3" fill="#a855f7" fill-opacity=".7"/>
  <!-- Post Image Media Container -->
  <rect x="113" y="366" width="374" height="230" rx="8" fill="url(#insta-grad)" fill-opacity=".85"/>
  <!-- Engagement Action Buttons (Hearts / Comments / Shares) -->
  <g>
    <circle cx="141" cy="651" r="18" fill="#f43f5e"/>
    <circle cx="206" cy="651" r="18" fill="#3b82f6"/>
    <circle cx="271" cy="651" r="18" fill="#10b981"/>
  </g>
  <rect x="113" y="706" width="318" height="12" rx="3" fill="#ffffff" fill-opacity=".75"/>
  <rect x="113" y="734" width="238" height="12" rx="3" fill="#a855f7" fill-opacity=".6"/>
  <text x="70" y="140" fill="#ffffff" font-family="Georgia,serif" font-size="62" font-weight="700">SOCIAL</text>
  <text x="72" y="178" fill="#ec4899" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="4">CONTENT / COMMUNITY</text>
</svg>
