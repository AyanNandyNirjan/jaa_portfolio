<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000">
  <defs>
    <linearGradient id="sky-grandior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#431407"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="roof-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="1000" fill="url(#sky-grandior)"/>
  <!-- Glowing Sun / Horizon Arc -->
  <circle cx="300" cy="450" r="140" fill="#f59e0b" fill-opacity=".15"/>
  <circle cx="300" cy="450" r="90" fill="#fbbf24" fill-opacity=".2"/>
  <!-- Luxury Home Architecture Silhouette -->
  <g fill="url(#roof-grad)" stroke="#d97706" stroke-opacity=".3" stroke-width="1.5">
    <path d="M-30 648L210 420 406 590 630 390V1000H-30Z"/>
    <rect x="85" y="555" width="145" height="310"/>
    <rect x="302" y="490" width="190" height="375"/>
  </g>
  <!-- Warm Glowing Windows -->
  <g fill="#fef08a" fill-opacity=".9">
    <rect x="115" y="603" width="25" height="38" rx="2"/>
    <rect x="163" y="603" width="25" height="38" rx="2"/>
    <rect x="115" y="674" width="25" height="38" rx="2"/>
    <rect x="163" y="674" width="25" height="38" rx="2"/>
    <rect x="335" y="548" width="31" height="45" rx="2"/>
    <rect x="394" y="548" width="31" height="45" rx="2"/>
    <rect x="335" y="625" width="31" height="45" rx="2"/>
    <rect x="394" y="625" width="31" height="45" rx="2"/>
  </g>
  <path d="M75 356H525" stroke="#f59e0b" stroke-opacity=".4" stroke-width="2"/>
  <path d="M75 386H425" stroke="#f59e0b" stroke-opacity=".2" stroke-width="1.5"/>
  <text x="70" y="140" fill="#fef08a" font-family="Georgia, serif" font-size="65" font-weight="700">GRANDIOR</text>
  <text x="72" y="181" fill="#f59e0b" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="4">SOCIAL / BRAND / HOMES</text>
