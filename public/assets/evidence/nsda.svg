<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000">
  <defs>
    <linearGradient id="bg-nsda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081530"/>
      <stop offset="60%" stop-color="#0f265c"/>
      <stop offset="100%" stop-color="#030914"/>
    </linearGradient>
    <radialGradient id="gold-seal">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="ribbon-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="1000" fill="url(#bg-nsda)"/>
  <!-- Ribbon Ribbons -->
  <path d="M210 590L160 880 300 800 440 880 390 590" fill="url(#ribbon-red)" stroke="#f59e0b" stroke-width="2"/>
