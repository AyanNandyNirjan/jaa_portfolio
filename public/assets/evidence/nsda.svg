  <circle cx="300" cy="460" r="165" fill="url(#gold-seal)" stroke="#78350f" stroke-width="4"/>
  <!-- Center Star Emblem -->
  <path d="M300 340L328 426 418 426 345 478 373 564 300 512 227 564 255 478 182 426 272 426Z" fill="#1e1b4b" stroke="#fef08a" stroke-width="3"/>
  <text x="300" y="475" text-anchor="middle" fill="#fef08a" font-family="Arial,sans-serif" font-size="48" font-weight="900">L3</text>
  <text x="58" y="122" fill="#ffffff" font-family="Georgia,serif" font-size="56" font-weight="700">CERTIFIED</text>
  <text x="60" y="160" fill="#fbbf24" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="4">NSDA LEVEL-3</text>
</svg>
